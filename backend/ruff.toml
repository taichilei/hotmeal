line-length = 88
indent-width = 4

[lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # isort - import 排序
  "B",   # flake8-bugbear
  "C4",  # flake8-comprehensions
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by black if used)
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]  # 允许 __init__.py 导入而不使用（用于导出）

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
